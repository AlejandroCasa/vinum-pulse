[project]
name = "vinum-pulse"
version = "0.1.0"
description = "Real-Time Sommelier Radar, Gastronomic Pairing Engine, and Cellar Analytics Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "black>=24.10.0",
    "commitizen>=4.19.3",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "pip-audit>=2.7.3",
    "pre-commit>=4.7.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "radon>=6.0.1",
    "ruff>=0.9.0",
    "xenon>=0.9.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    # Ignore Starlette's internal deprecation warning for httpx in TestClient,
    # as the project lockfile and architecture standardize on httpx (>=0.28.1)
    # while FastAPI's TestClient delegates directly to starlette.testclient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/ui.py" = ["E501"]
"app/sommelier.py" = ["E501"]
"app/schemas.py" = ["E501"]
"tests/test_sommelier.py" = ["E501"]
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
