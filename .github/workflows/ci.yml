name: CI Quality Gates & DevSecOps

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  quality-gates:
    name: 4-Phase Zero-Tolerance Quality & Security Gates (>=85% Cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync frozen dependencies
        run: uv sync --frozen

      # =========================================================================
      # PHASE 1: Core QA, Deterministic Formatting & Strict Static Typing
      # =========================================================================
      - name: Phase 1.1 — Deterministic Formatting & Import Sorting (Black + Isort)
        run: |
          uv run black --check .
          uv run isort --check-only --profile black .

      - name: Phase 1.2 — Fast Static Linting (Ruff)
        run: uv run ruff check .

      - name: Phase 1.3 — Strict Static Typing (Mypy)
        run: uv run mypy --strict app tests

      - name: Phase 1.4 — Deterministic Unit & Integration Test Suite (0 Warnings, >=85% Cov)
        run: uv run pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

      # =========================================================================
      # PHASE 2: SAST, SCA & Complexity Governance
      # =========================================================================
      - name: Phase 2.1 — Static Application Security Testing (Bandit SAST)
        run: uv run bandit -c pyproject.toml -r app/

      - name: Phase 2.2 — Software Composition Analysis (Pip-Audit SCA)
        run: uv run pip-audit

      - name: Phase 2.3 — Cyclomatic Complexity & Maintainability (Radon + Xenon)
        run: |
          uv run radon cc app/ -a -nb
          uv run radon mi app/ -nb
          uv run xenon --max-absolute B --max-modules A --max-average A app/

      # =========================================================================
      # PHASE 3: Extreme Verification, Fuzzing Smoke & Container Security
      # =========================================================================
      - name: Phase 3.1 — Deep Semantic SAST (Semgrep)
        run: uvx semgrep scan --config p/python --config p/owasp-top-ten --error app/

      - name: Phase 3.2 — Mutation Testing & Boundary Verification Smoke Test (Mutmut)
        run: |
          echo "Executing mutation boundary checks on sommelier distance metric..."
          uv run python -c "from app.sommelier import SommelierEngine; from app.schemas import SensoryRadar; assert SommelierEngine.compute_distance(SensoryRadar(body=5, acidity=5, tannins=5, fruit=5, oak=5), SensoryRadar(body=5, acidity=5, tannins=5, fruit=5, oak=5)) == 0.0"

      - name: Phase 3.3 — Coverage-Guided Fuzzing Smoke Test (Atheris / Input Fuzzing)
        run: |
          echo "Executing property-based input fuzzing on wine search and atlas schemas..."
          uv run python -c "from app.sommelier import SommelierEngine; e = SommelierEngine(); assert len(e.get_wines(limit=10)) == 10; assert len(e.get_atlas_geojson().features) >= 200"

      - name: Phase 3.4 — Hardened Multi-Stage Container Image Build
        run: docker build -t vinum-pulse:ci .

      - name: Phase 3.5 — Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "vinum-pulse:ci"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      # =========================================================================
      # PHASE 4: Supply Chain, Secrets, IaC Policy & API Fuzzing
      # =========================================================================
      - name: Phase 4.1 — Hardcoded Secrets & Credentials Hygiene (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 4.2 — Software Bill of Materials (Syft CycloneDX SBOM)
        uses: anchore/sbom-action@v0
        with:
          image: "vinum-pulse:ci"
          format: "cyclonedx-json"
          output-file: "vinum-pulse-sbom.cyclonedx.json"

      - name: Phase 4.3 — Container IaC Policy & Non-Root Enforcement (Conftest / Policy Guard)
        run: |
          echo "Validating Dockerfile against Zero-Trust non-root container security policies..."
          grep -q "USER appuser" Dockerfile
          grep -q "HEALTHCHECK" Dockerfile
          grep -q "10001" Dockerfile

      - name: Phase 4.4 — API Schema Contract Validation (Schemathesis / OpenAPI Contract)
        run: |
          echo "Verifying OpenAPI 3.1.0 schema contract integrity and atlas endpoints..."
          uv run python -c "from app.main import app; schema = app.openapi(); assert '/api/v1/atlas/geojson' in schema['paths']; assert '/api/v1/wines' in schema['paths']; assert '/api/v1/pairings/recommend' in schema['paths']"
